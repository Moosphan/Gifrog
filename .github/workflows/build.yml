name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14  # arm64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: bash scripts/build_app.sh --ci release

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R dist/Gifrog.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Gifrog" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            dist/Gifrog.dmg

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Gifrog-app
          path: dist/Gifrog.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gifrog-dmg
          path: dist/Gifrog.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: Gifrog-dmg
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Gifrog.dmg
          generate_release_notes: true
